         data.setColour = colourShuffle[2]
         countHard = countHard + 1
         }
    Answer = JSON.stringify(data.response)
    Answer2 = Answer.slice(6,)
    Answer3 = Answer2.match(/"([^"]+)"/)
    prevAnswer = Answer3[1]
    blockTime = data.rt 
    totalBlockTime = totalBlockTime + blockTime
    data.answer = prevAnswer
    data.correctAnswer = correctAnswer
    if(totalBlockTime < 180000) {
       timeLimitReached = false
    } else if (totalBlockTime >= 180000) {
       timeLimitReached = true
    }
    if(prevAnswer == correctAnswer) {
             data.correct = true

         } 
      }
